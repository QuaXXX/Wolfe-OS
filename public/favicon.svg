<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Subtle dark themed background so it never blends into light or dark browser tabs -->
  <rect width="24" height="24" rx="6" fill="#08090d" />
  <rect width="24" height="24" rx="6" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" fill="none" />
  
  <!-- Sleek Minimalist Geometric Wolf Head -->
  <!-- Left Ear -->
  <path fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M5.5 5.5L8.5 11L4.5 13.5L5.5 5.5Z" />
  <!-- Right Ear -->
  <path fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M18.5 5.5L15.5 11L19.5 13.5L18.5 5.5Z" />
  <!-- Crown / Forehead -->
  <path stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M8.5 11L12 8L15.5 11" />
  <!-- Snout to Nose -->
